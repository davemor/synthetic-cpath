name: cluster_sd_index_calibration
cache_name: cluster_sd_index_calibration_full_pool

k_min: 2
k_max: 50
report_name: cluster_sd_index_calibration

datasets:
  pathmnist224:
    display_name: Kather 100K
    manifest: ${oc.env:SYNPATH_DATA_ROOT,/raid/dm236/synpath/data}/manifests/pathmnist224_full.csv
    expected_train: 89996
    uni2_reuse:
      kind: ordered_manifest
      features: /raid/dm236/synpath_balanced_global_clusters/cache/clusters/pathmnist224/uni2_train_features.npz
      features_key: features
      manifest: /raid/dm236/synpath_balanced_global_clusters/data/manifests/pathmnist224.csv
  icaird_cervical100k:
    display_name: iCAIRD Cervical 100K
    manifest: ${oc.env:SYNPATH_DATA_ROOT,/raid/dm236/synpath/data}/manifests/icaird_cervical100k_full.csv
    expected_train: 100000
    uni2_reuse:
      kind: indexed
      features: /raid/dm236/data/icaird_cervical/icaird_cervical_120k_trainonly_slide_split_uni2_labelbalanced_kcenter/embeddings/uni2_h/features.npz
      features_key: features
      index: /raid/dm236/data/icaird_cervical/icaird_cervical_120k_trainonly_slide_split_uni2_labelbalanced_kcenter/embeddings/uni2_h/index.parquet
      sample_id_column: sample_id
      label_column: annotation_label_name
  pcam:
    display_name: PCam
    manifest: ${oc.env:SYNPATH_DATA_ROOT,/raid/dm236/synpath/data}/manifests/pcam_full.csv
    expected_train: 262144

encoders:
  dino_vitb8:
    display_name: DINO ViT-B/8
    model: facebook/dino-vitb8
    dimension: 768
    batch_size: 64
  uni2:
    display_name: UNI2-h
    model: hf-hub:MahmoodLab/UNI2-h
    dimension: 1536
    batch_size: 32

kmeans:
  init: k-means++
  n_init: 10
  max_iter: 300
  random_state: 0

resources:
  embedding_workers: 12
  gpu_required: true
