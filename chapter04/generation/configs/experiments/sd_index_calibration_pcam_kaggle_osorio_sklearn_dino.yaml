name: cluster_sd_index_calibration_pcam_kaggle_osorio_sklearn_dino
cache_name: cluster_sd_index_calibration_pcam_kaggle_osorio_sklearn_dino

k_min: 2
k_max: 50
report_name: cluster_sd_index_calibration_pcam_kaggle_osorio_sklearn_dino

datasets:
  pcam:
    display_name: Kaggle PCam with Osorio curation
    manifest: ${oc.env:SYNPATH_DATA_ROOT,/raid/dm236/synpath/data}/manifests/pcam_kaggle_full.csv
    expected_train: 220025
    curation:
      kind: osorio_pcam_foreground
      workers: 72
      thresholds:
        th_V_max: 70
        th_S_max: 3
        th_std_V: 4
        th_std_S: 4
        th_std_H: 1.5
        th_var_L: 100
        th_n_contour: 10
    feature_reuse:
      dino_vitb8:
        kind: indexed
        features: /raid/dm236/synpath/cache/cluster_sd_index_calibration_pcam_kaggle_osorio_standardized_sdbw/pcam/dino_vitb8/train_features.npy
        features_key: null
        index: /raid/dm236/synpath/cache/cluster_sd_index_calibration_pcam_kaggle_osorio_standardized_sdbw/pcam/dino_vitb8/train_index.parquet
        sample_id_column: sample_id
        label_column: label

encoders:
  dino_vitb8:
    display_name: DINO ViT-B/8
    model: facebook/dino-vitb8
    dimension: 768
    batch_size: 64
    fit_transform: standard_scaler

kmeans:
  backend: sklearn
  init: k-means++
  n_init: 10
  max_iter: 300
  random_state: 18021999
  algorithm: lloyd

sd_index_scorer:
  kind: s_dbw_sd_0_4_0
  package_version: 0.4.0
  k: 1.0
  alg_noise: bind
  centr: mean
  nearest_centr: true
  metric: euclidean
  scoring_space: raw_embeddings

resources:
  embedding_workers: 24
  gpu_required: false

report_notes:
  - This is the exact scikit-learn DINO sensitivity sweep requested before adopting a production k.
  - The source is Kaggle's 220,025-patch deduplicated PCam training population used by Osorio et al.
  - The released Osorio filters retain 216,886 patches in the pinned SynPath environment, 18 more than the 216,868 reported in the paper.
  - K-means uses scikit-learn's Lloyd implementation with k-means++, n_init=10, max_iter=300, and the released seed 18021999.
  - K-means is fitted on globally standardized DINO embeddings; s-dbw 0.4.0 SD scores are computed on the original raw embeddings.
  - Existing production cluster assignments are not modified.
