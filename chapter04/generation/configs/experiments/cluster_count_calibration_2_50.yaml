name: cluster_count_calibration_2_50
cache_name: cluster_k_calibration_2_50
report_name: cluster_k_calibration_2_50
report_kind: cluster_count_validity

k_min: 2
k_max: 50

datasets:
  pathmnist224:
    display_name: Kather 100K training set
    manifest: ${oc.env:SYNPATH_DATA_ROOT,/raid/dm236/synpath/data}/manifests/pathmnist224_full.csv
    expected_train: 89996
    feature_reuse:
      dino_vitb8:
        kind: indexed
        features: /raid/dm236/synpath/cache/cluster_sd_index_calibration_full_pool/pathmnist224/dino_vitb8/train_features.npy
        features_key: null
        index: /raid/dm236/synpath/cache/cluster_sd_index_calibration_full_pool/pathmnist224/dino_vitb8/train_index.parquet
        source_metadata: /raid/dm236/synpath/cache/cluster_sd_index_calibration_full_pool/pathmnist224/dino_vitb8/features_metadata.json
        sample_id_column: sample_id
        label_column: label
  icaird_cervical100k:
    display_name: iCAIRD Cervical 100K training split
    manifest: ${oc.env:SYNPATH_DATA_ROOT,/raid/dm236/synpath/data}/manifests/icaird_cervical100k_full.csv
    expected_train: 100000
    feature_reuse:
      dino_vitb8:
        kind: indexed
        features: /raid/dm236/synpath/cache/cluster_sd_index_calibration_full_pool/icaird_cervical100k/dino_vitb8/train_features.npy
        features_key: null
        index: /raid/dm236/synpath/cache/cluster_sd_index_calibration_full_pool/icaird_cervical100k/dino_vitb8/train_index.parquet
        source_metadata: /raid/dm236/synpath/cache/cluster_sd_index_calibration_full_pool/icaird_cervical100k/dino_vitb8/features_metadata.json
        sample_id_column: sample_id
        label_column: label
      uni2:
        kind: indexed
        features: /raid/dm236/data/icaird_cervical/icaird_cervical_120k_trainonly_slide_split_uni2_labelbalanced_kcenter/embeddings/uni2_h/features.npz
        features_key: features
        index: /raid/dm236/data/icaird_cervical/icaird_cervical_120k_trainonly_slide_split_uni2_labelbalanced_kcenter/embeddings/uni2_h/index.parquet
        sample_id_column: sample_id
        label_column: annotation_label_name

  pcam:
    display_name: Official PCam training set
    manifest: ${oc.env:SYNPATH_DATA_ROOT,/raid/dm236/synpath/data}/manifests/pcam_full.csv
    expected_train: 262144
    feature_reuse:
      dino_vitb8:
        kind: indexed
        features: /raid/dm236/synpath/cache/cluster_sd_index_calibration_full_pool/pcam/dino_vitb8/train_features.npy
        features_key: null
        index: /raid/dm236/synpath/cache/cluster_sd_index_calibration_full_pool/pcam/dino_vitb8/train_index.parquet
        source_metadata: /raid/dm236/synpath/cache/cluster_sd_index_calibration_full_pool/pcam/dino_vitb8/features_metadata.json
        sample_id_column: sample_id
        label_column: label
      uni2:
        kind: indexed
        features: /raid/dm236/synpath/cache/cluster_sd_index_calibration_full_pool/pcam/uni2/train_features.npy
        features_key: null
        index: /raid/dm236/synpath/cache/cluster_sd_index_calibration_full_pool/pcam/uni2/train_index.parquet
        sample_id_column: sample_id
        label_column: label

  pcam_osorio:
    display_name: Osorio-curated PCam training set
    manifest: ${oc.env:SYNPATH_DATA_ROOT,/raid/dm236/synpath/data}/manifests/pcam_kaggle_full.csv
    expected_train: 220025
    expected_after_curation: 216886
    curation:
      kind: osorio_pcam_foreground
      workers: 72
      image_mode: rgb
      thresholds:
        th_V_max: 70
        th_S_max: 3
        th_std_V: 4
        th_std_S: 4
        th_std_H: 1.5
        th_var_L: 100
        th_n_contour: 10
    feature_reuse:
      dino_vitb8:
        kind: indexed
        features: /raid/dm236/synpath/cache/cluster_sd_index_calibration_pcam_kaggle_osorio_standardized_sdbw/pcam/dino_vitb8/train_features.npy
        features_key: null
        index: /raid/dm236/synpath/cache/cluster_sd_index_calibration_pcam_kaggle_osorio_standardized_sdbw/pcam/dino_vitb8/train_index.parquet
        source_metadata: /raid/dm236/synpath/cache/cluster_sd_index_calibration_pcam_kaggle_osorio_standardized_sdbw/pcam/dino_vitb8/features_metadata.json
        sample_id_column: sample_id
        label_column: label
      uni2:
        kind: indexed
        features: /raid/dm236/synpath/cache/cluster_sd_index_calibration_pcam_kaggle_osorio_standardized_sdbw/pcam/uni2/train_features.npy
        features_key: null
        index: /raid/dm236/synpath/cache/cluster_sd_index_calibration_pcam_kaggle_osorio_standardized_sdbw/pcam/uni2/train_index.parquet
        sample_id_column: sample_id
        label_column: label

encoders:
  dino_vitb8:
    display_name: DINO ViT-B/8
    model: facebook/dino-vitb8
    dimension: 768
    batch_size: 64
    preprocessing: model_creator_defaults
    fit_transform: standard_scaler
  uni2:
    display_name: UNI2-h
    model: hf-hub:MahmoodLab/UNI2-h
    dimension: 1536
    batch_size: 32
    fit_transform: standard_scaler

kmeans:
  backend: cuml
  init: k-means++
  n_init: 10
  max_iter: 300
  random_state: 0

sd_index_scorer:
  kind: halkidi_dis_at_kmax
  scoring_space: fit_features

validity:
  elbow:
    algorithm: kneedle
    sensitivity: 1.0
    curve: convex
    direction: decreasing
    online: false
  silhouette:
    sample_size: 10000
    seeds: [0, 1, 2]
    sampling: uniform_without_replacement
    scoring_space: fit_features
  osorio_s_dbw:
    enabled_tracks:
      - pcam_osorio/dino_vitb8
    package_version: 0.4.0
    k: 1.0
    alg_noise: bind
    centr: mean
    nearest_centr: true
    metric: euclidean
    scoring_space: raw_embeddings

external_osorio_audit:
  results_path: /raid/dm236/synpath/reports/cluster_sd_index_calibration_pcam_kaggle_osorio_released_dino/sd_index_results.csv
  description: Released preprocessing and scikit-learn Lloyd K-means audit

resources:
  embedding_workers: 8
  gpu_required: true

report_notes:
  - Kather, iCAIRD, and official PCam are calibrated using their complete training sets before any experiment cap is applied.
  - The iCAIRD source collection contains 120K curated patches, but its manifest assigns 100K to train and 20K to validation; only the 100K training split is calibrated.
  - Osorio foreground curation retains 216,886 Kaggle training patches in the pinned SynPath environment, 18 more than the 216,868 reported in the paper.
  - Matching the published k range does not guarantee k=33 because population, preprocessing, scaling, backend, initialization, and SD implementation affect the curve.
