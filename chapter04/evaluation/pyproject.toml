[project]
name = "synpath"
version = "0.1.0"
description = "Synthetic histopathology generation benchmark with label, unconditioned, and pseudo-label conditioning."
readme = "README.md"
authors = [{ name = "David Morrison", email = "dm236@st-andrews.ac.uk" }]
requires-python = ">=3.12,<3.14"
dependencies = [
    "click>=8.1",
    "dotenv>=0.9.9",
    "huggingface-hub>=0.24",
    "hydra-core>=1.3.2",
    "imageio-ffmpeg>=0.5",
    "matplotlib>=3.9",
    "medmnist>=3.0",
    "ninja>=1.11",
    "numpy<2.3",
    "omegaconf>=2.3.0",
    "pandas>=2.2",
    "pillow>=10.0",
    "psutil>=5.9",
    "pyspng>=0.1.2",
    "pyarrow>=16.0",
    "pyyaml>=6.0",
    "requests>=2.32",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "torch>=2.4",
    "torchvision>=0.19",
    "tqdm>=4.67",
    "tabulate>=0.9",
    "timm>=1.0",
    "typer>=0.12",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]
keywords = [
    "histopathology",
    "synthetic-data",
    "generative-models",
    "diffusion",
    "gan",
    "pseudo-labels",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[project.scripts]
synpath = "synpath.cli.main:main"

[project.optional-dependencies]
gpu = [
    "accelerate>=0.33",
    "clean-fid>=0.1.35",
    "datasets>=3.0",
    "diffusers>=0.30",
    "lpips>=0.1.4",
    "peft>=0.12",
    "torchmetrics>=1.4",
    "transformers>=4.44",
]
rapids = [
    "cuml-cu12>=25.12",
]

[build-system]
requires = ["uv_build>=0.9.24,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 80

[tool.ruff.format]
line-ending = "auto"

[tool.pytest.ini_options]
markers = [
    "gpu: marks tests that require CUDA",
    "slow: marks tests as slow",
]
