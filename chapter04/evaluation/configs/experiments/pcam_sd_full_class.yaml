name: pcam_sd_full_class_label

generation:
  sd_full:
    base_model: runwayml/stable-diffusion-v1-5
    num_processes: 8
    mixed_precision: fp16
    train_resolution: 512
    train_batch_size: 8
    gradient_accumulation_steps: 1
    max_train_steps: 12500
    learning_rate: 0.00001
    gradient_checkpointing: true
    center_crop: true
    enable_xformers_memory_efficient_attention: false
    dataloader_num_workers: 8
    checkpointing_steps: 1000
    checkpoints_total_limit: 2

pcam_sd_full:
  output_subdir: audits/pcam_sd_full_class_label
  train_data_dir: ${oc.env:SYNPATH_OUTPUTS_ROOT,/raid/dm236/synpath/outputs}/generators/pcam/sd_lora/true_label/seed0/training_images
  expected_train_samples: 50000
  source_condition_manifest: ${oc.env:SYNPATH_OUTPUTS_ROOT,/raid/dm236/synpath/outputs}/conditions/pcam/true_label/condition_manifest.csv
  real_test_manifest: ${oc.env:SYNPATH_OUTPUTS_ROOT,/raid/dm236/synpath/outputs}/audits/pcam_sd_lora_resolution_balance/real_test_manifest.csv
  test_embeddings: ${oc.env:SYNPATH_CACHE_ROOT,/raid/dm236/synpath/cache}/embeddings/pcam/test_uni_224.parquet
  expected_prompts:
    a histopathology patch of non_metastatic: 25000
    a histopathology patch of metastatic: 25000
  preflight_steps: 20
  seed: 0
  synthetic_samples: 5000
  sampling_seed: 0
  sample_gpus: 8
  sample_batch_size: 8
  num_inference_steps: 50
  guidance_scale: 7.5
  precision_recall_k: 3
  precision_recall_batch_size: 512
