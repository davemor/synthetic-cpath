name: pcam_sd_full_class_curated

generation:
  sd_full:
    base_model: runwayml/stable-diffusion-v1-5
    num_processes: 8
    mixed_precision: fp16
    train_resolution: 512
    train_batch_size: 8
    gradient_accumulation_steps: 1
    max_train_steps: 12500
    learning_rate: 0.00001
    gradient_checkpointing: true
    center_crop: true
    enable_xformers_memory_efficient_attention: false
    dataloader_num_workers: 8
    checkpointing_steps: 1000
    checkpoints_total_limit: 2

pcam_sd_full:
  output_subdir: audits/pcam_sd_full_class_curated
  train_data_dir: ${oc.env:SYNPATH_OUTPUTS_ROOT,/raid/dm236/synpath/outputs}/audits/pcam_sd_full_class_curated/training_images
  expected_train_samples: 50000
  expected_prompts:
    Histology image of healthy tissue: 25000
    Histology image of cancer tissue: 25000
  curation:
    curated_manifest: ${oc.env:SYNPATH_CACHE_ROOT,/raid/dm236/synpath/cache}/cluster_sd_index_calibration_pcam_kaggle_osorio_released_dino/pcam/curation/curated_manifest.csv
    cluster_labels: ${oc.env:SYNPATH_CACHE_ROOT,/raid/dm236/synpath/cache}/cluster_sd_index_calibration_pcam_kaggle_osorio_released_dino/pcam/dino_vitb8/fits/k_33_labels.npy
    fit_metadata: ${oc.env:SYNPATH_CACHE_ROOT,/raid/dm236/synpath/cache}/cluster_sd_index_calibration_pcam_kaggle_osorio_released_dino/pcam/dino_vitb8/fits/k_33.json
    expected_curated_population: 216886
    clusters_per_class: 15
  reuse_preflight_from: ${oc.env:SYNPATH_OUTPUTS_ROOT,/raid/dm236/synpath/outputs}/audits/pcam_sd_full_class_label/preflight/preflight_complete.json
  source_condition_manifest: ${oc.env:SYNPATH_OUTPUTS_ROOT,/raid/dm236/synpath/outputs}/conditions/pcam/true_label/condition_manifest.csv
  real_test_manifest: ${oc.env:SYNPATH_OUTPUTS_ROOT,/raid/dm236/synpath/outputs}/audits/pcam_sd_lora_resolution_balance/real_test_manifest.csv
  test_embeddings: ${oc.env:SYNPATH_CACHE_ROOT,/raid/dm236/synpath/cache}/embeddings/pcam/test_uni_224.parquet
  preflight_steps: 20
  seed: 0
  synthetic_samples: 5000
  sampling_seed: 0
  sample_gpus: 8
  sample_batch_size: 8
  num_inference_steps: 50
  guidance_scale: 7.5
  precision_recall_k: 3
  precision_recall_batch_size: 512
