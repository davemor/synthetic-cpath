name: audit_pcam_sd_lora_resolution_balance

images:
  generator_size: 256
  stain_normalization: false

generation:
  sd_lora:
    base_model: runwayml/stable-diffusion-v1-5
    rank: 16
    num_processes: 8
    mixed_precision: fp16
    train_batch_size: 8
    gradient_accumulation_steps: 1
    max_train_steps: 5000
    learning_rate: 0.00001
    gradient_checkpointing: true
    attention_backend: torch2_sdpa
    enable_xformers_memory_efficient_attention: false
    checkpointing_steps: 1000
    checkpoints_total_limit: 5
    training_image_mode: hardlink

pcam_sd_lora_audit:
  output_subdir: audits/pcam_sd_lora_resolution_balance
  source_condition_manifest: ${oc.env:SYNPATH_OUTPUTS_ROOT,/raid/dm236/synpath/outputs}/conditions/pcam/label_global_cluster/condition_manifest.csv
  dataset_manifest: ${oc.env:SYNPATH_DATA_ROOT,/raid/dm236/synpath/data}/manifests/pcam.csv
  validation_embeddings: ${oc.env:SYNPATH_CACHE_ROOT,/raid/dm236/synpath/cache}/embeddings/pcam/val_uni_224.parquet
  test_embeddings: ${oc.env:SYNPATH_CACHE_ROOT,/raid/dm236/synpath/cache}/embeddings/pcam/test_uni_224.parquet
  cluster_model: ${oc.env:SYNPATH_CACHE_ROOT,/raid/dm236/synpath/cache}/clusters/pcam/global_kmeans_model.joblib
  real_test_manifest: ${oc.env:SYNPATH_OUTPUTS_ROOT,/raid/dm236/synpath/outputs}/audits/pcam_sd_lora_resolution_balance/real_test_manifest.csv
  expected_source_count: 50000
  train_samples: 17412
  balanced_samples_per_prompt: 2902
  validation_samples_per_prompt: 100
  real_test_samples: 5000
  synthetic_samples: 5000
  training_seed: 0
  selection_seed: 0
  sampling_seed: 0
  evaluation_seed: 0
  preflight_steps: 20
  require_preflight: true
  checkpoints: [1000, 2000, 3000, 4000, 5000]
  retained_clusters:
    metastatic: [1, 0, 2]
    non_metastatic: [2, 3, 0]
  arms:
    control_256:
      resolution: 256
      prompt_distribution: unbalanced
    native_512:
      resolution: 512
      prompt_distribution: unbalanced
    balanced_256:
      resolution: 256
      prompt_distribution: balanced
  validation_loss:
    batch_size: 8
    num_workers: 2
    seed: 2026
  validation_num_shards: 8
  sample_gpus: 8
  sample_batch_size: 8
  num_inference_steps: 30
  guidance_scale: 7.5
  precision_recall_k: 3
  precision_recall_batch_size: 512
