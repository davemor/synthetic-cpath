name: smoke

datasets:
  - pathmnist224

generators:
  - stylegan2ada

conditioning_modes:
  - true_label
  - pseudo_label
  - label_global_cluster
  - label_local_cluster

seeds:
  generators: [0]
  classifiers: [0]
  clustering: [0]

images:
  native_size: 224
  generator_size: 256
  output_format: png
  stain_normalization: false

pseudo_labels:
  encoder: uni
  algorithm: kmeans
  k_candidates: [4, 8]
  label_local_cluster_k_candidates: [2]
  min_cluster_size: 8

limits:
  max_train_images: 256
  max_val_images: 128
  max_test_images: 128
  max_synthetic_images: 256

generation:
  synthetic_multiplier: 1.0
  preserve_distribution: true
  sd_lora:
    train_batch_size: 4
    max_train_steps: 5
    learning_rate: 0.0001
  stylegan2ada:
    backend: stylegan3
    cfg: stylegan2
    aug: ada
    batch_size: 16
    gamma: 0.8192
    kimg: 1
    tick: 1
    snap: 1

metrics:
  max_real: 256
  max_synthetic: 256
  seed: 0

utility:
  classifier: resnet18
  pretrained: imagenet
  batch_size: 16
  epochs: 1
  lr: 0.001
  weight_decay: 0.0001
  sources:
    - real_only

pipeline:
  stages:
    - prepare_data
    - embed
    - cluster
    - build_conditions
    - train_generator
    - sample
    - evaluate_quality
    - train_utility
    - report
