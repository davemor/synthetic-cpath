datasets:
- kather100k
- spider-colorectal
- spider-breast
- spider-skin
- spider-thorax
- icaird100k
encoders:
- uni
- uni2
- hibou
- dinov2
seeds:
  calibration:
    projector:
    - 0
    - 1
    - 2
    classifier:
    - 0
    - 1
    - 2
  curve:
  - 0
  - 1
  - 2
  evaluation:
  - 0
  - 1
  - 2
  - 3
  - 4
num_folds: 5
calibration:
  projector:
    select: mean-knn-score-mean
    subsample: 50000
    dimensions:
    - 1
    - 2
    - 4
    - 8
    - 16
    - 32
    - 128
    - 256
    - 512
    - 1024
    measurements:
    - name: mean-knn-score
      params:
        ks:
        - 5
        - 15
        - 30
    projectors:
    - name: pca
      params: {}
    - name: grp
      params: {}
    - name: umap
      params:
        n_neighbors:
        - 2
        - 5
        - 10
        - 20
        - 50
        - 100
        - 200
        min_dist:
        - 0.0
        - 0.1
        - 0.25
        - 0.5
        - 0.8
        - 0.99
        metric:
        - cosine
  classifier:
    select: accuracy
    subsample: 50000
    dimensions:
    - 2
    - 8
    classifiers:
    - name: logistic-regression
      params:
        C:
        - 0.01
        - 0.1
        - 1
        - 10
        - 100
        max_iter:
        - 2000
        linesearch_max_iter:
        - 300
        tol:
        - 1.0e-05
curve:
  dimension_intervals:
  - start: 1
    stop: 50
    step: 1
  - start: 32
    stop: 1024
    step: 50
  include_full_dimension: false
  subsample: 50000
  projectors:
  - pca
  - umap
  - grp
  classifiers:
  - logistic-regression
  measurements:
  - name: mean-knn-score
    params:
      ks:
      - 5
      - 30
  - name: silhouette-score
    params: {}
  - name: trustworthiness
thresholds:
  metrics:
  - accuracy
  - roc_auc
  conditions:
  - 0.99
  - 0.95
intrinsic_dims:
  subsample: 10000
report:
  detail_dims: 50
generalisation:
  measurements:
  - name: mean-knn-score
    params:
      ks:
      - 5
      - 30
  - name: silhouette-score
    params: {}
  - name: trustworthiness
    params: {}
  projectors:
  - name: pca
    params: {}
  - name: grp
    params: {}
  - name: umap
    params:
      subsample:
      - 50000
      n_neighbors:
      - 10
      - 50
      - 200
      min_dist:
      - 0.1
      - 0.99
      metric:
      - cosine
  classifiers:
  - name: logistic-regression
    params:
      C:
      - 1
      - 100
      max_iter:
      - 2000
      linesearch_max_iter:
      - 300
      tol:
      - 1.0e-05
  - name: mlp
    params:
      hidden_layer_sizes:
      - - 100
        - 50
      activation:
      - relu
      solver:
      - adam
      alpha:
      - 0.001
      learning_rate:
      - constant
      learning_rate_init:
      - 0.001
      max_iter:
      - 200
      early_stopping:
      - true
  - name: xgboost
    search:
      method: random
      n_iter: 12
      random_state: 0
    params:
      n_estimators:
      - 100
      - 200
      learning_rate:
      - 0.05
      - 0.1
      max_depth:
      - 3
      - 6
      min_child_weight:
      - 1
      - 8
      subsample:
      - 0.8
      - 1.0
      colsample_bytree:
      - 0.8
      - 1.0
      gamma:
      - 0
      - 0.5
      reg_lambda:
      - 1.0
      - 10.0
      reg_alpha:
      - 0
      - 0.001
