run:
  output_dir: /home/dm236/scratch/icaird_cervical_benchmark/runs
  seeds: [0, 1, 2]

data:
  dataset_root: /data/Kather100K
  image_size: 224
  num_workers: 8

images:
  enabled: true
  models: [resnet18]
  epochs: 100
  batch_size: 64
  patience: 10
  pretrained: true
  require_cuda: true
  augmentation_suites: [none, geometric, colour, hed, combined]
  augmentation_probability: 0.75
  hed_sigma: 0.03
  search:
    method: fixed
    n_iter: 1
    learning_rate: [1.0e-4]
    weight_decay: [1.0e-4]

probes:
  enabled: false

mil:
  enabled: false
