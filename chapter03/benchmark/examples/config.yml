run:
  output_dir: runs/icaird_cervical
  seeds: [0, 1, 2]

data:
  dataset_root: /path/to/icaird_cervical_100k
  image_size: 224
  num_workers: 4

images:
  enabled: true
  models: [resnet18, densenet121, efficientnet_b4, convnext_tiny, swin_tiny_patch4_window7_224]
  optional_models: [vit_b_16]
  epochs: 100
  batch_size: 64
  patience: 10
  pretrained: true
  search:
    method: random
    n_iter: 12
    learning_rate: [1.0e-5, 3.0e-5, 1.0e-4, 3.0e-4]
    weight_decay: [0.0, 1.0e-4, 1.0e-2]

probes:
  enabled: true
  cv_folds: 5
  embeddings:
    # Each path may be a per-split .npz containing features/labels, a hproj-style
    # combined .npz with train_features/train_labels/test_features/test_labels,
    # or a directory containing train.npz, valid.npz, and test.npz.
    uni: /path/to/uni_embeddings
    uni2:
      path: /path/to/uni2_embeddings
      citation: "Add UNI2 model-card or paper citation here before publication."
    hibou: /path/to/hibou_embeddings
    dinov2: /path/to/dinov2_embeddings
    manual_features: /path/to/manual_features
  classifiers:
    logistic-regression:
      params:
        C: [1, 100]
        max_iter: [2000]
        linesearch_max_iter: [300]
        tol: [1.0e-5]
    mlp:
      params:
        hidden_layer_sizes: [[100, 50]]
        activation: [relu]
        solver: [adam]
        alpha: [0.001]
        learning_rate: [constant]
        learning_rate_init: [0.001]
        max_iter: [200]
        early_stopping: [true]
    xgboost:
      search:
        method: random
        n_iter: 12
        random_state: 0
      params:
        n_estimators: [100, 200]
        learning_rate: [0.05, 0.1]
        max_depth: [3, 6]
        min_child_weight: [1, 8]
        subsample: [0.8, 1.0]
        colsample_bytree: [0.8, 1.0]
        gamma: [0, 0.5]
        reg_lambda: [1.0, 10.0]
        reg_alpha: [0, 0.001]
