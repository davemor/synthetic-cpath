[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "icaird-cervical-benchmark"
version = "0.1.0"
description = "CLI benchmarks for iCAIRD Cervical 100K ImageFolder patches and embedding probes."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "click>=8.1",
  "matplotlib>=3.7",
  "numpy>=1.24",
  "pandas>=2.0",
  "pillow>=9.5",
  "pyarrow>=15.0",
  "pyyaml>=6.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "tqdm>=4.65",
  "torch==2.6.0",
  "torchvision==0.21.0",
  "timm>=0.9",
  "xgboost>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
icaird-cervical-benchmark = "icaird_cervical_benchmark.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
