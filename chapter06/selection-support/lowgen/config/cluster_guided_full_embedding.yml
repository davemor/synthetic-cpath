paths:
  hypatia_run_root: /raid/experiments/dimred_dgx_followup/hypatia_curve_source
  non_icaird_embeddings_root: /raid/experiments/hdims/embeddings
  icaird_embeddings_root: /raid/datasets/icaird_cervical_120k_trainonly_slide_split_uni2_labelbalanced_kcenter/embeddings
  output_root: /raid/experiments/lowgen_v2/output
  run_name: lowgen-v2-cluster-guided-full-embedding

datasets:
  - icaird100k
  - kather100k

encoders:
  - uni2

seeds: [0, 1, 2]
num_folds: 5

projection:
  projectors: [pca, umap]
  fixed_dimensions: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512]
  threshold_metrics: []
  threshold_conditions: []
  threshold_classifier: logistic-regression
  include_intrinsic: false
  include_raw_highdim: true
  umap_n_neighbors: 10
  umap_min_dist: 0.99
  umap_metric: cosine

generator:
  kinds: [resample, diagonal_gaussian, diagonal_gmm]
  conditioning_modes: [unconditioned, true_label]
  gmm_components: 5
  gmm_covariance_type: diag
  gmm_fit_subsample: 10000
  gmm_max_iter: 100
  gmm_select_k: true
  gmm_candidate_components: [1, 2, 3, 5, 8, 10]
  gmm_selection_metric: bic
  gmm_min_samples_per_component: 100
  timeout_seconds: 7200

cluster_conditioning:
  clustering_results_path: /raid/experiments/lowgen_v2/output/lowgen-v2-cluster-guided-full-embedding/cluster_guided_full_embedding_inputs/clustering_results_selected.csv
  max_rows:
  min_clusters: 2
  max_noise_fraction: 0.5
  include_noise_cluster: false
  generator_kinds: [cluster_guided_full_diag_gmm4_probe, label_guided_full_diag_gmm4_probe, cluster_label_guided_full_diag_gmm4_probe]
  synthetic_total: 5000
  min_cluster_size: 2
  min_variance: 1.0e-6
  gmm_components: 4
  gmm_fit_subsample: 10000
  gmm_max_iter: 100
  gmm_reg_covar: 1.0e-6

eval:
  knn_k: 15
  classifier_max_iter: 2000
  fid_subsample: 5000
  kid_subsample: 2000
  nn_subsample: 5000
  pairwise_subsample: 2000
  cluster_count_k: 20

runtime:
  require_cuml: true
  dask_dashboard_address:
