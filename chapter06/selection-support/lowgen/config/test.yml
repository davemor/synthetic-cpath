datasets:
  - kather100k

encoders:
  - uni

seeds:
  base_seed: 0
  num_seeds: 5

num_folds: 5

reducers:
  - kind: pca
    dimensions: [9, 16]
    whiten: false

generator:
  kinds:
    - resample
    - isotropic
    - gaussian
    - gmm
    - bgmm
  max_components: 20
  conditional: true

eval:
  knn_k: 15
  probe_max_iter: 1500
  mmd_subsample: 1000