paths:
  embeddings_root: /home/dm236/scratch/hproj/embeddings
  dimensionality_run_root: /home/dm236/scratch/hproj/output/runs/hproj-2026-05-25_16-41-27-bb2a5203-icaird100k
  output_root: /home/dm236/scratch/histology_clustering/output
  run_name: clustering-curve-targets

datasets:
  - icaird100k
  - kather100k
  - spider-colorectal
  - spider-breast
  - spider-skin
  - spider-thorax

encoders:
  - uni
  - uni2
  - hibou
  - dinov2

seeds: [0, 1, 2]

projection:
  projectors: [pca, umap]
  include_raw_full: true
  include_one_dim: true
  explicit_dimension_min: 1
  explicit_dimension_max: 50
  threshold_metrics: [roc_auc]
  threshold_conditions: [0.95, 0.99]
  threshold_classifier: logistic-regression
  umap:
    n_neighbors: 10
    min_dist: 0.99
    metric: cosine
    fit_subsample: 50000

clustering:
  fit_subsample_fraction: 0.10
  fit_subsample_min: 10000
  fit_subsample_max: 50000
  metric_subsample: 10000
  clusterers: [kmeans, hdbscan, leiden]
  kmeans:
    k: [4, 8, 16, 24, 32, 48, 64, 96, 128, 192, 256]
    init: k-means++
    n_init: 10
    max_iter: 300
  hdbscan:
    min_cluster_size: [50, 100, 200]
    min_samples: [25]
    cluster_selection_method: [eom]
    alpha: 1.0
  leiden:
    n_neighbors: [15, 30]
    resolution: [0.5, 1.0, 2.0]
    metric: cosine
    max_iter: 100
    theta: 1.0

runtime:
  require_cuml: true
  allow_cpu_fallback: false
