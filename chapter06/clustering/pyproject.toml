[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "histology-clustering-experiment"
version = "0.1.0"
description = "Standalone clustering experiment for histology foundation-model embeddings."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "click>=8.1",
  "matplotlib>=3.8",
  "numpy>=1.24",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "scikit-learn>=1.3",
  "tqdm>=4.65",
]

[project.optional-dependencies]
hypatia = [
  "torch>=2.0",
]
dev = ["pytest>=7.4"]

[project.scripts]
cluster-exp = "cluster_exp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
