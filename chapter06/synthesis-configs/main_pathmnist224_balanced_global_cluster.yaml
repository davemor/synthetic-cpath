name: main_pathmnist224_balanced_global_cluster

datasets:
  - pathmnist224

generators:
  - stylegan2ada
  - sd_lora
  - dcgan

conditioning_modes:
  - pseudo_label
  - label_global_cluster

seeds:
  generators: [0]
  classifiers: [0, 1, 2]
  clustering: [0]

images:
  native_size: 224
  generator_size: 256
  output_format: png
  stain_normalization: false

pseudo_labels:
  encoder: uni2
  algorithm: external_global_pca_kmeans
  projector: pca
  dimension: 50
  clusterer: kmeans
  global_clusters_only: true
  intraclass_clustering_used: false
  cluster_params:
    n_clusters: 24
    init: k-means++
    n_init: 10
    max_iter: 300
  selection_rule: balanced_compromise
  selection_rule_description: support/noise/validity filters; stability hard filter; Pareto front over calibrated proxies for ROC-AUC, FID, KID, precision, recall, stability, and support; closest-to-utopia balanced compromise selection
  cluster_config_path: /raid/dm236/synpath_balanced_global_clusters/cache/clusters/pathmnist224/selected_global_k.yaml
  label_artifact_path: /raid/dm236/synpath_balanced_global_clusters/cache/clusters/pathmnist224/pseudo_labels.csv

generation:
  synthetic_multiplier: 1.0
  preserve_distribution: true
  sd_lora:
    train_batch_size: 16
    max_train_steps: 10000
    learning_rate: 0.0001
    sample_batch_size: 8
    sample_gpus: 8
    sample_height: 256
    sample_width: 256
  stylegan2ada:
    backend: stylegan3
    cfg: stylegan2
    aug: ada
    batch_size: 32
    gamma: 0.8192
    kimg: 2000
    tick: 4
    snap: 50
  dcgan:
    image_size: 256
    latent_dim: 128
    base_channels: 64
    batch_size: 128
    epochs: 50
    max_steps: 20000
    lr: 0.0002
    beta1: 0.5
    beta2: 0.999
    num_workers: 4
    sample_batch_size: 128
    use_data_parallel: true

metrics:
  max_real: 10000
  max_synthetic: 10000
  seed: 0
  quality:
    - inception_fid
    - uni_fid_kid
    - uni_precision_recall
    - uni_cluster_coverage
    - privacy_nearest_neighbor

utility:
  classifier: resnet18
  pretrained: imagenet
  synthetic_generators:
    - stylegan2ada
    - sd_lora
    - dcgan
  batch_size: 128
  epochs: 50
  lr: 0.001
  weight_decay: 0.0001
  evaluate_on: real_test
  sources:
    - synthetic_only_label_global_cluster
    - real_plus_synthetic_label_global_cluster
  metrics:
    - accuracy
    - macro_f1
    - weighted_f1
    - macro_roc_auc_ovr
    - classification_report
    - confusion_matrix

pipeline:
  stages:
    - prepare_data
    - embed
    - cluster
    - build_conditions
    - train_generator
    - sample
    - evaluate_quality
    - train_utility
    - report
